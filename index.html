<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0b14">
    <title>Drizzlearn — AI Learning Workspace</title>
    <meta name="description" content="Drizzlearn turns any learning goal into structured course roadmaps, interactive practice studios, spaced-repetition flashcards, Markdown notes, and grounded AI tutoring.">
    <meta name="keywords" content="Drizzlearn, AI tutor, learning roadmap, spaced repetition, flashcards, interactive practice, study planner, focus timer, curriculum generator">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <link rel="canonical" href="/" vite-ignore>

    <!-- Favicons and PWA Manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Open Graph (Facebook / LinkedIn) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Drizzlearn">
    <meta property="og:title" content="Drizzlearn — AI Learning Workspace">
    <meta property="og:description" content="Drizzlearn turns any learning goal into structured course roadmaps, interactive practice studios, spaced-repetition flashcards, Markdown notes, and grounded AI tutoring.">
    <meta property="og:url" content="/">
    <meta property="og:image" content="/images/hero-banner.png">
    <meta property="og:image:alt" content="Drizzlearn AI Learning Companion & Course Roadmap">
    <meta property="og:locale" content="en_US">

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Drizzlearn — AI Learning Workspace">
    <meta name="twitter:description" content="Drizzlearn turns any learning goal into structured course roadmaps, interactive practice studios, spaced-repetition flashcards, Markdown notes, and grounded AI tutoring.">
    <meta name="twitter:image" content="/images/hero-banner.png">
    <meta name="twitter:image:alt" content="Drizzlearn AI Learning Companion & Course Roadmap">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Drizzlearn",
        "url": "https://drizzlearn.app",
        "description": "AI-powered personalized learning workspace that turns goals into structured roadmaps, interactive practice, and spaced-repetition review.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All modern web browsers",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "AI-synthesized course roadmaps",
          "Multi-mode interactive practice studio",
          "Cognitive science spaced-repetition flashcards with LaTeX formula support",
          "Real-time synchronized focus study rooms",
          "Grounded AI tutoring with structured explain, hint, quiz, and review modes"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
