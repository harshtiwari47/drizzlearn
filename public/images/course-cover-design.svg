<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160" fill="none">
  <defs>
    <linearGradient id="des-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24142a" />
      <stop offset="100%" stop-color="#0a0912" />
    </linearGradient>
    <linearGradient id="des-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#8555ff" />
    </linearGradient>
  </defs>
  <rect width="400" height="160" fill="url(#des-bg)" />
  <circle cx="330" cy="80" r="80" fill="#ec4899" opacity="0.1" />

  <!-- Overlapping Glassmorphic Design Primitives -->
  <rect x="250" y="40" width="70" height="70" rx="16" fill="#2d1b38" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.6" transform="rotate(-15 285 75)" />
  <circle cx="330" cy="80" r="35" fill="#1f152b" stroke="#d4ff3a" stroke-width="1.5" stroke-opacity="0.8" />
  <polygon points="350,50 385,110 315,110" stroke="#f43f5e" stroke-width="1.5" fill="none" opacity="0.7" transform="rotate(20 350 80)" />

  <!-- Pen tool bezier node handles -->
  <line x1="280" y1="120" x2="360" y2="120" stroke="#d4ff3a" stroke-width="1.5" stroke-dasharray="2 2" />
  <circle cx="280" cy="120" r="3.5" fill="#d4ff3a" />
  <circle cx="360" cy="120" r="3.5" fill="#d4ff3a" />
</svg>
