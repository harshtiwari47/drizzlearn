<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160" fill="none">
  <defs>
    <linearGradient id="ai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19162b" />
      <stop offset="100%" stop-color="#0b0b14" />
    </linearGradient>
    <linearGradient id="ai-v" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  <rect width="400" height="160" fill="url(#ai-bg)" />
  <circle cx="340" cy="80" r="100" fill="#8555ff" opacity="0.15" />
  <circle cx="340" cy="80" r="50" fill="#d4ff3a" opacity="0.08" />
  
  <!-- Neural Network Lattice -->
  <g stroke="#8555ff" stroke-width="1.5" stroke-opacity="0.5">
    <line x1="280" y1="40" x2="330" y2="70" />
    <line x1="280" y1="90" x2="330" y2="70" />
    <line x1="280" y1="130" x2="330" y2="110" />
    <line x1="330" y1="70" x2="370" y2="50" />
    <line x1="330" y1="70" x2="370" y2="100" />
    <line x1="330" y1="110" x2="370" y2="100" />
  </g>
  <!-- Nodes -->
  <circle cx="280" cy="40" r="4" fill="#a87cff" />
  <circle cx="280" cy="90" r="4" fill="#a87cff" />
  <circle cx="280" cy="130" r="4" fill="#a87cff" />
  <circle cx="330" cy="70" r="6" fill="#d4ff3a" />
  <circle cx="330" cy="110" r="5" fill="#8555ff" />
  <circle cx="370" cy="50" r="4" fill="#c084fc" />
  <circle cx="370" cy="100" r="5" fill="#d4ff3a" />
  
  <!-- Wave Pulse -->
  <path d="M 0 130 Q 100 110 200 135 T 400 120" stroke="#8555ff" stroke-width="2" stroke-opacity="0.3" fill="none" />
</svg>
