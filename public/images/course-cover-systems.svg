<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160" fill="none">
  <defs>
    <linearGradient id="sys-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a29" />
      <stop offset="100%" stop-color="#090a11" />
    </linearGradient>
    <linearGradient id="sys-lime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4ff3a" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
  </defs>
  <rect width="400" height="160" fill="url(#sys-bg)" />
  <circle cx="330" cy="80" r="90" fill="#0284c7" opacity="0.12" />
  
  <!-- Circuit & Microchip Traces -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round">
    <path d="M 240 50 H 290 L 320 80 H 380" />
    <path d="M 230 110 H 280 L 300 90 H 360" />
    <path d="M 270 30 V 60 L 290 80" />
    <path d="M 340 140 V 100 L 320 80" />
  </g>
  <circle cx="240" cy="50" r="3" fill="#38bdf8" />
  <circle cx="230" cy="110" r="3" fill="#d4ff3a" />
  <circle cx="380" cy="80" r="4" fill="#d4ff3a" />
  <circle cx="360" cy="90" r="3.5" fill="#a87cff" />

  <!-- Central Micro-Core -->
  <rect x="306" y="66" width="28" height="28" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <circle cx="320" cy="80" r="5" fill="#d4ff3a" />
</svg>
