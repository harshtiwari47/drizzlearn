<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" fill="none">
  <defs>
    <filter id="n-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="n-blush" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <linearGradient id="n-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff" />
      <stop offset="35%" stop-color="#c084fc" />
      <stop offset="90%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="n-pad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(42, 38, 74, 0.85)" />
      <stop offset="100%" stop-color="rgba(24, 20, 48, 0.95)" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <ellipse cx="120" cy="110" rx="75" ry="60" fill="#a855f7" opacity="0.2" filter="url(#n-glow)" />

  <!-- Notepad (Transparent Rounded Card) -->
  <rect x="55" y="65" width="130" height="110" rx="16" fill="url(#n-pad)" stroke="#8555ff" stroke-width="2" />
  <rect x="55" y="65" width="130" height="28" rx="16" fill="#4c1d95" opacity="0.6" />
  <!-- Notepad Spiral Rings -->
  <circle cx="80" cy="65" r="4" fill="#d4ff3a" filter="url(#n-glow)" />
  <circle cx="105" cy="65" r="4" fill="#d4ff3a" filter="url(#n-glow)" />
  <circle cx="130" cy="65" r="4" fill="#d4ff3a" filter="url(#n-glow)" />
  <circle cx="155" cy="65" r="4" fill="#d4ff3a" filter="url(#n-glow)" />

  <!-- Note lines with checkmarks -->
  <line x1="85" y1="108" x2="160" y2="108" stroke="#e9d5ff" stroke-width="2" stroke-linecap="round" />
  <circle cx="75" cy="108" r="3" fill="#d4ff3a" />
  
  <line x1="85" y1="126" x2="150" y2="126" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />
  <circle cx="75" cy="126" r="3" fill="#d4ff3a" />

  <line x1="85" y1="144" x2="135" y2="144" stroke="#e9d5ff" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <circle cx="75" cy="144" r="3" fill="#a87cff" />

  <!-- Cute Companion Peeking Out from Behind Note (NO Antenna!) -->
  <g transform="translate(10, 2)">
    <!-- Cute Round Head with Glossy Dome -->
    <ellipse cx="110" cy="54" rx="44" ry="36" fill="url(#n-body)" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" />
    <ellipse cx="110" cy="27" rx="20" ry="5" fill="#ffffff" opacity="0.4" />
    
    <!-- Visor -->
    <rect x="76" y="40" width="68" height="30" rx="15" fill="#140f29" stroke="rgba(192,132,252,0.45)" stroke-width="1.5" />

    <!-- Cute Eyes (Winking / Cheerful!) -->
    <!-- Left Eye: Big Sparkly Eye -->
    <ellipse cx="92" cy="55" rx="5" ry="6" fill="#ffffff" filter="url(#n-glow)" />
    <circle cx="93" cy="53" r="2" fill="#140f29" />
    <circle cx="91" cy="52" r="1.5" fill="#ffffff" />
    
    <!-- Right Eye: Winking ^ -->
    <path d="M 118 57 Q 124 50 130 57" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#n-glow)" />

    <!-- Blushing Cheeks -->
    <circle cx="84" cy="61" r="5" fill="#f43f5e" opacity="0.75" filter="url(#n-blush)" />
    <circle cx="136" cy="61" r="5" fill="#f43f5e" opacity="0.75" filter="url(#n-blush)" />
  </g>

  <!-- Cute Floating Stylus / Pencil -->
  <g transform="translate(182, 105) rotate(25)" filter="url(#n-glow)">
    <rect x="0" y="0" width="10" height="42" rx="4" fill="#d4ff3a" />
    <polygon points="0,42 10,42 5,52" fill="#e9d5ff" />
    <circle cx="5" cy="51" r="1.5" fill="#4c1d95" />
    <circle cx="5" cy="6" r="3" fill="#ffffff" />
  </g>

  <!-- Paws Peeking over Note -->
  <ellipse cx="78" cy="80" rx="7" ry="5" fill="#c084fc" stroke="#ffffff" stroke-width="1" />
  <ellipse cx="162" cy="80" rx="7" ry="5" fill="#c084fc" stroke="#ffffff" stroke-width="1" />

  <!-- Magic Sparkles -->
  <circle cx="45" cy="115" r="2.5" fill="#d4ff3a" filter="url(#n-glow)" />
  <circle cx="195" cy="70" r="3" fill="#d4ff3a" filter="url(#n-glow)" />
  <circle cx="190" cy="160" r="2" fill="#c084fc" />
</svg>
