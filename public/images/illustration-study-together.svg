<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <defs>
    <filter id="st-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="st-table-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1f33" />
      <stop offset="100%" stop-color="#121320" />
    </linearGradient>
    <linearGradient id="st-table-front" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#171829" />
      <stop offset="100%" stop-color="#0a0b12" />
    </linearGradient>
    <linearGradient id="violet-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8555ff" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="lime-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4ff3a" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <ellipse cx="300" cy="220" rx="190" ry="90" fill="#8555ff" opacity="0.18" filter="url(#st-glow)" />
  <ellipse cx="300" cy="180" rx="70" ry="70" fill="#d4ff3a" opacity="0.08" filter="url(#st-glow)" />

  <!-- Grid Perspective Lines on Floor -->
  <g stroke="#1d1f30" stroke-width="1" opacity="0.6">
    <line x1="120" y1="360" x2="300" y2="240" />
    <line x1="200" y1="380" x2="300" y2="240" />
    <line x1="400" y1="380" x2="300" y2="240" />
    <line x1="480" y1="360" x2="300" y2="240" />
    <ellipse cx="300" cy="300" rx="220" ry="70" stroke="#22243a" stroke-dasharray="6 6" fill="none" />
  </g>

  <!-- Central Collaborative Oval Table (Isometric) -->
  <!-- Table Base / Shadow -->
  <ellipse cx="300" cy="255" rx="160" ry="55" fill="url(#st-table-front)" stroke="#22243b" stroke-width="1.5" />
  <!-- Table Top Surface -->
  <ellipse cx="300" cy="245" rx="160" ry="55" fill="url(#st-table-top)" stroke="#8555ff" stroke-width="1.5" stroke-opacity="0.6" />
  <!-- Table Inset Light Ring -->
  <ellipse cx="300" cy="245" rx="130" ry="42" stroke="url(#violet-glow-grad)" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="12 8" />

  <!-- Center Holographic Study Core / Floating Crystal Prism -->
  <polygon points="300,140 330,175 300,210 270,175" fill="url(#violet-glow-grad)" opacity="0.8" filter="url(#soft-glow)" />
  <polygon points="300,140 330,175 300,185 270,175" fill="#c084fc" opacity="0.9" />
  <line x1="300" y1="210" x2="300" y2="245" stroke="#d4ff3a" stroke-width="2" stroke-dasharray="3 3" filter="url(#soft-glow)" />
  <circle cx="300" cy="245" r="4" fill="#d4ff3a" filter="url(#soft-glow)" />

  <!-- Participant 1 (Left - Active Pod) -->
  <g transform="translate(180, 190)">
    <!-- Pod Platform -->
    <ellipse cx="0" cy="40" rx="35" ry="14" fill="#131422" stroke="#8555ff" stroke-width="1.5" stroke-opacity="0.8" />
    <!-- Hologram Ray -->
    <path d="M-22 36 L-10 0 L10 0 L22 36 Z" fill="url(#violet-glow-grad)" opacity="0.12" />
    <!-- Avatar Holographic Sphere -->
    <circle cx="0" cy="-6" r="16" fill="#1a1b2d" stroke="#8555ff" stroke-width="2" />
    <circle cx="0" cy="-6" r="10" fill="url(#violet-glow-grad)" opacity="0.7" filter="url(#soft-glow)" />
    <!-- Online Lime Dot -->
    <circle cx="12" cy="4" r="3.5" fill="#d4ff3a" filter="url(#soft-glow)" />
    <!-- Light Beam to Center Table -->
    <path d="M15 32 Q 60 40 90 48" stroke="#8555ff" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="4 4" />
  </g>

  <!-- Participant 2 (Right - Active Pod) -->
  <g transform="translate(420, 190)">
    <!-- Pod Platform -->
    <ellipse cx="0" cy="40" rx="35" ry="14" fill="#131422" stroke="#8555ff" stroke-width="1.5" stroke-opacity="0.8" />
    <!-- Hologram Ray -->
    <path d="M-22 36 L-10 0 L10 0 L22 36 Z" fill="url(#violet-glow-grad)" opacity="0.12" />
    <!-- Avatar Holographic Sphere -->
    <circle cx="0" cy="-6" r="16" fill="#1a1b2d" stroke="#8555ff" stroke-width="2" />
    <circle cx="0" cy="-6" r="10" fill="url(#violet-glow-grad)" opacity="0.7" filter="url(#soft-glow)" />
    <!-- Online Lime Dot -->
    <circle cx="12" cy="4" r="3.5" fill="#d4ff3a" filter="url(#soft-glow)" />
    <!-- Light Beam to Center Table -->
    <path d="M-15 32 Q -60 40 -90 48" stroke="#8555ff" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="4 4" />
  </g>

  <!-- Participant 3 (Center Top - Active Pod / Host) -->
  <g transform="translate(300, 130)">
    <ellipse cx="0" cy="30" rx="30" ry="12" fill="#131422" stroke="#d4ff3a" stroke-width="1.5" stroke-opacity="0.9" />
    <!-- Host Ring Glow -->
    <ellipse cx="0" cy="30" rx="30" ry="12" stroke="#d4ff3a" stroke-width="1" filter="url(#soft-glow)" opacity="0.7" />
    <circle cx="0" cy="-10" r="14" fill="#1a1b2d" stroke="#d4ff3a" stroke-width="2" />
    <circle cx="0" cy="-10" r="8" fill="url(#lime-grad)" opacity="0.8" filter="url(#soft-glow)" />
    <circle cx="10" cy="-2" r="3" fill="#d4ff3a" filter="url(#soft-glow)" />
  </g>

  <!-- Floating Holographic Data Panels / Shared Notes -->
  <g transform="translate(230, 160)">
    <polygon points="0,0 45,-12 45,22 0,34" fill="#1a1b2e" stroke="#8555ff" stroke-width="1" fill-opacity="0.7" />
    <line x1="8" y1="8" x2="36" y2="0" stroke="#a87cff" stroke-width="1.5" />
    <line x1="8" y1="16" x2="28" y2="10" stroke="#d4ff3a" stroke-width="1.5" />
    <line x1="8" y1="24" x2="38" y2="16" stroke="#8555ff" stroke-width="1.5" />
  </g>
  <g transform="translate(325, 150)">
    <polygon points="0,-12 45,0 45,34 0,22" fill="#1a1b2e" stroke="#d4ff3a" stroke-width="1" stroke-opacity="0.7" fill-opacity="0.7" />
    <line x1="8" y1="2" x2="36" y2="10" stroke="#d4ff3a" stroke-width="1.5" />
    <line x1="8" y1="10" x2="28" y2="17" stroke="#a87cff" stroke-width="1.5" />
    <line x1="8" y1="18" x2="38" y2="26" stroke="#8555ff" stroke-width="1.5" />
  </g>

  <!-- Ambient Light Sparks -->
  <circle cx="150" cy="140" r="2" fill="#a87cff" filter="url(#soft-glow)" />
  <circle cx="450" cy="130" r="2" fill="#d4ff3a" filter="url(#soft-glow)" />
  <circle cx="210" cy="290" r="1.5" fill="#ffffff" />
  <circle cx="390" cy="285" r="1.5" fill="#ffffff" />
</svg>
