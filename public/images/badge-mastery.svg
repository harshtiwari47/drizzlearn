<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <filter id="badge-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="badge-gold-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4ff3a" />
      <stop offset="35%" stop-color="#a87cff" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="badge-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2e49" />
      <stop offset="50%" stop-color="#191a29" />
      <stop offset="100%" stop-color="#0e0f19" />
    </linearGradient>
    <linearGradient id="lime-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4ff3a" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
  </defs>

  <!-- Ambient Energy Flare -->
  <circle cx="80" cy="80" r="50" fill="#8555ff" opacity="0.25" filter="url(#badge-glow)" />

  <!-- Outer Precision Gauge Ring -->
  <circle cx="80" cy="80" r="68" stroke="#26273b" stroke-width="2" stroke-dasharray="4 6" />
  
  <!-- Outer Gyroscopic Ring with Slanted Orbit -->
  <ellipse cx="80" cy="80" rx="72" ry="32" transform="rotate(-25 80 80)" stroke="url(#badge-gold-violet)" stroke-width="2.5" opacity="0.75" />
  <circle cx="20" cy="55" r="3" fill="#d4ff3a" filter="url(#badge-glow)" />
  <circle cx="140" cy="105" r="2.5" fill="#a87cff" />

  <!-- Secondary Gyroscopic Ring -->
  <ellipse cx="80" cy="80" rx="72" ry="32" transform="rotate(35 80 80)" stroke="#8555ff" stroke-width="2" opacity="0.45" stroke-dasharray="8 4" />

  <!-- Main Dark Titanium Shield Disc -->
  <circle cx="80" cy="80" r="48" fill="url(#badge-ring)" stroke="#8555ff" stroke-width="2" />
  <circle cx="80" cy="80" r="44" stroke="#d4ff3a" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3 3" />

  <!-- Stylized Geometric Laurel Leaves (Lime) -->
  <g fill="url(#lime-accent)" opacity="0.9">
    <!-- Left Laurel -->
    <path d="M42 80 C40 68 46 56 54 48 C50 56 50 68 54 74 Z" />
    <path d="M38 70 C34 60 40 50 48 44 C44 52 44 62 48 66 Z" />
    <path d="M48 92 C42 84 44 72 52 66 C48 74 48 84 54 88 Z" />
    
    <!-- Right Laurel (Mirrored) -->
    <path d="M118 80 C120 68 114 56 106 48 C110 56 110 68 106 74 Z" />
    <path d="M122 70 C126 60 120 50 112 44 C116 52 116 62 112 66 Z" />
    <path d="M112 92 C118 84 116 72 108 66 C112 74 112 84 106 88 Z" />
  </g>

  <!-- Central Star Polyhedron / Core -->
  <polygon points="80,50 92,72 114,80 92,88 80,110 68,88 46,80 68,72" fill="#8555ff" filter="url(#badge-glow)" opacity="0.9" />
  <polygon points="80,56 89,74 106,80 89,86 80,104 71,86 54,80 71,74" fill="#a87cff" />
  <polygon points="80,64 85,76 96,80 85,84 80,96 75,84 64,80 75,76" fill="#ffffff" />
  <circle cx="80" cy="80" r="3" fill="#d4ff3a" filter="url(#badge-glow)" />

  <!-- Status Pips on Lower Disc -->
  <circle cx="70" cy="116" r="2" fill="#d4ff3a" />
  <circle cx="80" cy="118" r="2.5" fill="#d4ff3a" filter="url(#badge-glow)" />
  <circle cx="90" cy="116" r="2" fill="#d4ff3a" />
</svg>
