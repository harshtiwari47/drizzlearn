<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200" fill="none">
  <defs>
    <filter id="f-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="f-blush" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <linearGradient id="f-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff" />
      <stop offset="30%" stop-color="#c084fc" />
      <stop offset="85%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="card-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(192, 132, 252, 0.45)" />
      <stop offset="100%" stop-color="rgba(124, 58, 237, 0.25)" />
    </linearGradient>
    <linearGradient id="card-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(212, 255, 58, 0.4)" />
      <stop offset="100%" stop-color="rgba(132, 204, 22, 0.2)" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <ellipse cx="120" cy="120" rx="75" ry="60" fill="#a855f7" opacity="0.2" filter="url(#f-glow)" />

  <!-- Floating Transparent Card 1 (Left, Tilted) -->
  <g transform="translate(42, 60) rotate(-18)" filter="url(#f-glow)">
    <rect width="44" height="58" rx="8" fill="url(#card-grad1)" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="22" cy="22" r="7" fill="rgba(255,255,255,0.2)" />
    <text x="22" y="27" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle">?</text>
    <line x1="10" y1="38" x2="34" y2="38" stroke="#e9d5ff" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="45" x2="26" y2="45" stroke="#d4ff3a" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Floating Transparent Card 2 (Top Center, Glowing) -->
  <g transform="translate(98, 24) rotate(4)" filter="url(#f-glow)">
    <rect width="44" height="58" rx="8" fill="url(#card-grad2)" stroke="#d4ff3a" stroke-width="1.8" />
    <circle cx="22" cy="22" r="7" fill="rgba(212,255,58,0.25)" />
    <!-- Cute Star in Card -->
    <path d="M 22 15 L 24 20 L 29 20 L 25 24 L 27 29 L 22 26 L 17 29 L 19 24 L 15 20 L 20 20 Z" fill="#d4ff3a" />
    <line x1="10" y1="38" x2="34" y2="38" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="45" x2="28" y2="45" stroke="#c084fc" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Floating Transparent Card 3 (Right, Tilted) -->
  <g transform="translate(155, 55) rotate(16)" filter="url(#f-glow)">
    <rect width="44" height="58" rx="8" fill="url(#card-grad1)" stroke="#c084fc" stroke-width="1.5" />
    <!-- Cute Checkmark -->
    <path d="M 14 22 L 20 28 L 30 16" stroke="#d4ff3a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <line x1="10" y1="38" x2="34" y2="38" stroke="#e9d5ff" stroke-width="2" stroke-linecap="round" />
    <line x1="10" y1="45" x2="26" y2="45" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Cute Juggling Companion Body (Smooth Dome - NO Antenna!) -->
  <ellipse cx="120" cy="132" rx="55" ry="46" fill="url(#f-body)" />
  <ellipse cx="120" cy="132" rx="54" ry="45" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" />
  <!-- Glossy Dome Highlight -->
  <ellipse cx="120" cy="94" rx="26" ry="6" fill="#ffffff" opacity="0.4" />

  <!-- Cute Ears -->
  <rect x="58" y="116" width="11" height="22" rx="5.5" fill="#d4ff3a" filter="url(#f-glow)" />
  <rect x="171" y="116" width="11" height="22" rx="5.5" fill="#d4ff3a" filter="url(#f-glow)" />

  <!-- Visor -->
  <rect x="78" y="112" width="84" height="42" rx="17" fill="#140f29" stroke="rgba(192,132,252,0.45)" stroke-width="1.5" />

  <!-- Cheerful Happy Eyes (^ ^) -->
  <path d="M 94 130 Q 101 120 108 130" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#f-glow)" />
  <path d="M 132 130 Q 139 120 146 130" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#f-glow)" />

  <!-- Blushing Cheeks -->
  <circle cx="91" cy="138" r="6" fill="#f43f5e" opacity="0.75" filter="url(#f-blush)" />
  <circle cx="149" cy="138" r="6" fill="#f43f5e" opacity="0.75" filter="url(#f-blush)" />

  <!-- Open Joyful Mouth ▽ -->
  <path d="M 115 136 Q 120 144 125 136 Z" fill="#d4ff3a" filter="url(#f-glow)" />

  <!-- Cute Paws Up (Juggling Position) -->
  <circle cx="76" cy="114" r="8" fill="#c084fc" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="164" cy="114" r="8" fill="#c084fc" stroke="#ffffff" stroke-width="1.5" />

  <!-- Orbiting Sparkles -->
  <circle cx="48" cy="130" r="2.5" fill="#d4ff3a" filter="url(#f-glow)" />
  <circle cx="192" cy="125" r="3" fill="#d4ff3a" filter="url(#f-glow)" />
  <circle cx="120" cy="184" r="2" fill="#c084fc" />
</svg>
