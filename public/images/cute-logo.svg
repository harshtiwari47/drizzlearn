<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="36" height="36" fill="none">
  <defs>
    <filter id="logo-star-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Ambient Soft Glow -->
  <circle cx="18" cy="18" r="10" fill="#ffffff" opacity="0.3" filter="url(#logo-star-glow)" />
  
  <!-- 4-Point Radiant Sparkle Star -->
  <path d="M 18 3 Q 18 18 3 18 Q 18 18 18 33 Q 18 18 33 18 Q 18 18 18 3 Z" fill="#ffffff" filter="url(#logo-star-glow)" />
  
  <!-- Diagonal Mini Sparkle Points -->
  <path d="M 18 8 Q 18 18 8 18 Q 18 18 18 28 Q 18 18 28 18 Q 18 18 18 8 Z" fill="#d4ff3a" opacity="0.8" transform="rotate(45 18 18)" />

  <!-- Center Glossy Pearl -->
  <circle cx="18" cy="18" r="3" fill="#ffffff" />
  <circle cx="18" cy="18" r="1.5" fill="#d4ff3a" />
</svg>
