<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <filter id="tr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="tr-blush" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" />
    </filter>
    <linearGradient id="star-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fde047" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="trophy-cup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff" />
      <stop offset="35%" stop-color="#c084fc" />
      <stop offset="90%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="lime-ribbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4ff3a" />
      <stop offset="100%" stop-color="#84cc16" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="80" cy="75" r="48" fill="#d4ff3a" opacity="0.15" filter="url(#tr-glow)" />
  <circle cx="80" cy="75" r="35" fill="#c084fc" opacity="0.25" filter="url(#tr-glow)" />

  <!-- Trophy Base (Soft Lavender Glass) -->
  <path d="M 52 135 L 108 135 L 100 120 L 60 120 Z" fill="url(#trophy-cup)" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" />
  <rect x="46" y="135" width="68" height="12" rx="6" fill="#4c1d95" stroke="#c084fc" stroke-width="1.5" />
  <!-- Base Highlight -->
  <line x1="56" y1="139" x2="104" y2="139" stroke="#d4ff3a" stroke-width="1.5" stroke-linecap="round" />

  <!-- Trophy Stem -->
  <rect x="74" y="98" width="12" height="24" rx="4" fill="url(#trophy-cup)" />

  <!-- Trophy Cup Body -->
  <path d="M 44 48 C 44 88 64 100 80 100 C 96 100 116 88 116 48 Z" fill="url(#trophy-cup)" stroke="rgba(255,255,255,0.6)" stroke-width="1.8" />
  
  <!-- Trophy Handles -->
  <!-- Left Handle -->
  <path d="M 46 54 C 28 54 28 82 48 84" stroke="url(#lime-ribbon)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#tr-glow)" />
  <!-- Right Handle -->
  <path d="M 114 54 C 132 54 132 82 112 84" stroke="url(#lime-ribbon)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#tr-glow)" />

  <!-- Adorable Cute Star Inside / Rising from Trophy -->
  <g transform="translate(80, 52)" filter="url(#tr-glow)">
    <!-- Star Shape -->
    <path d="M 0 -28 L 7 -9 L 26 -7 L 12 7 L 16 26 L 0 16 L -16 26 L -12 7 L -26 -7 L -7 -9 Z" fill="url(#star-gold)" stroke="#ffffff" stroke-width="2" />
    
    <!-- Star Gloss Highlight -->
    <circle cx="-6" cy="-14" r="3" fill="#ffffff" opacity="0.8" />

    <!-- Cute Smiling Face on Star -->
    <!-- Eyes (^ ^) -->
    <path d="M -9 1 Q -5 -5 -1 1" stroke="#4c1d95" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 1 1 Q 5 -5 9 1" stroke="#4c1d95" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Blushing Cheeks -->
    <circle cx="-11" cy="4" r="3" fill="#f43f5e" opacity="0.8" filter="url(#tr-blush)" />
    <circle cx="11" cy="4" r="3" fill="#f43f5e" opacity="0.8" filter="url(#tr-blush)" />
    <!-- Open Happy Mouth -->
    <path d="M -3 4 Q 0 8 3 4 Z" fill="#b91c1c" />
  </g>

  <!-- Lime Ribbon Hanging from Trophy -->
  <path d="M 72 100 L 64 125 L 72 120 L 80 125 Z" fill="url(#lime-ribbon)" />
  <path d="M 88 100 L 96 125 L 88 120 L 80 125 Z" fill="url(#lime-ribbon)" />

  <!-- Floating Victory Confetti & Sparkles -->
  <circle cx="28" cy="40" r="3" fill="#d4ff3a" filter="url(#tr-glow)" />
  <circle cx="134" cy="36" r="3" fill="#fde047" filter="url(#tr-glow)" />
  <circle cx="34" cy="98" r="2.5" fill="#c084fc" />
  <circle cx="128" cy="100" r="2.5" fill="#d4ff3a" />
</svg>
